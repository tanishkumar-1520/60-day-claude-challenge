<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"></stop>
      <stop offset="55%" stop-color="#111a35"></stop>
      <stop offset="100%" stop-color="#17102b"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"></stop>
      <stop offset="50%" stop-color="#818cf8"></stop>
      <stop offset="100%" stop-color="#a78bfa"></stop>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"></stop>
      <stop offset="100%" stop-color="#4ade80"></stop>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"></feDropShadow>
    </filter>

    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #94a3b8; }
      .section { font: 700 17px Arial, sans-serif; fill: #f8fafc; }
      .label { font: 600 13px Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 400 12px Arial, sans-serif; fill: #94a3b8; }
      .value { font: 700 25px Arial, sans-serif; fill: #f8fafc; }
      .greenText { fill: #4ade80; }
      .blueText { fill: #38bdf8; }
      .purpleText { fill: #a78bfa; }
      .orangeText { fill: #fb923c; }
      .redText { fill: #f87171; }
      .card { fill: #111a2e; stroke: #263552; stroke-width: 1; }
      .inner { fill: #0d1628; stroke: #263552; stroke-width: 1; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="1100" fill="url(#bg)"></rect>

  <!-- HEADER -->
  <rect x="45" y="35" width="1510" height="105" rx="22" fill="#101a30" stroke="#2b3b5d"></rect>
  <circle cx="90" cy="87" r="27" fill="#172554"></circle>
  <text x="90" y="96" text-anchor="middle" font-size="28">🥗</text>

  <text x="135" y="78" class="title">NutriScope Business Strategy Dashboard</text>
  <text x="135" y="108" class="subtitle">
    Day 24 • Business Reality Check • Revenue • GTM • Competition • Investment
  </text>

  <!-- VERDICT -->
  <rect x="1340" y="62" width="170" height="50" rx="25" fill="#422006" stroke="#fb923c"></rect>
  <circle cx="1370" cy="87" r="8" fill="#f59e0b"></circle>
  <text x="1390" y="93" font-family="Arial" font-size="16" font-weight="700" fill="#fed7aa">
    VALIDATE
  </text>

  <!-- BUSINESS MODEL -->
  <rect x="45" y="165" width="490" height="285" rx="18" class="card" filter="url(#shadow)"></rect>
  <text x="70" y="200" class="section">1. BUSINESS MODEL</text>
  <text x="70" y="225" class="small">From nutrition tracking to actionable intelligence</text>

  <rect x="70" y="250" width="200" height="75" rx="12" class="inner"></rect>
  <text x="88" y="275" class="label">TARGET CUSTOMER</text>
  <text x="88" y="300" class="small">Health-conscious</text>
  <text x="88" y="316" class="small">18–35 consumers</text>

  <rect x="290" y="250" width="215" height="75" rx="12" class="inner"></rect>
  <text x="308" y="275" class="label">CORE VALUE</text>
  <text x="308" y="300" class="small">Food data → insights</text>
  <text x="308" y="316" class="small">→ daily actions</text>

  <rect x="70" y="340" width="435" height="82" rx="12" fill="#101b32" stroke="#33466b"></rect>
  <text x="88" y="365" class="label">BUSINESS MODEL</text>
  <text x="88" y="391" font-family="Arial" font-size="18" font-weight="700" fill="#38bdf8">
    Freemium → Premium Subscription
  </text>
  <text x="88" y="410" class="small">Free tracking • Paid intelligence • Future B2B</text>


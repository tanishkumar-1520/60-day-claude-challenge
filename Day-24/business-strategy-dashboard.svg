  <rect x="560" y="165" width="490" height="285" rx="18" class="card" filter="url(#shadow)"></rect>
  <text x="585" y="200" class="section">2. REVENUE STREAMS</text>
  <text x="585" y="225" class="small">Primary focus: recurring revenue</text>

  <rect x="585" y="250" width="205" height="78" rx="12" class="inner"></rect>
  <text x="605" y="275" class="label">FREE</text>
  <text x="605" y="302" class="value">₹0</text>
  <text x="665" y="302" class="small">Basic tracking</text>

  <rect x="810" y="250" width="215" height="78" rx="12" fill="#10251d" stroke="#2f6b4a"></rect>
  <text x="830" y="275" class="label greenText">PREMIUM</text>
  <text x="830" y="302" class="value">₹199</text>
  <text x="900" y="302" class="small">/ month</text>

  <rect x="585" y="343" width="205" height="78" rx="12" class="inner"></rect>
  <text x="605" y="368" class="label purpleText">ANNUAL</text>
  <text x="605" y="395" class="value">₹1,499</text>
  <text x="605" y="412" class="small">Annual membership</text>

  <rect x="810" y="343" width="215" height="78" rx="12" class="inner"></rect>
  <text x="830" y="368" class="label orangeText">FUTURE</text>
  <text x="830" y="395" class="value">B2B</text>
  <text x="830" y="412" class="small">Gyms • Coaches • Wellness</text>


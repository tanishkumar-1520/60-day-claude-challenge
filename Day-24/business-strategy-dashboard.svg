  <rect x="1075" y="165" width="480" height="285" rx="18" class="card" filter="url(#shadow)"></rect>
  <text x="1100" y="200" class="section">3. GO-TO-MARKET FLOW</text>
  <text x="1100" y="225" class="small">Distribution before feature expansion</text>

  <rect x="1100" y="255" width="105" height="52" rx="26" fill="#172554"></rect>
  <text x="1152" y="286" text-anchor="middle" class="label blueText">CONTENT</text>

  <text x="1212" y="286" font-size="22" fill="#64748b">→</text>

  <rect x="1240" y="255" width="105" height="52" rx="26" fill="#1e1b4b"></rect>
  <text x="1292" y="286" text-anchor="middle" class="label purpleText">SIGNUP</text>

  <text x="1352" y="286" font-size="22" fill="#64748b">→</text>

  <rect x="1380" y="255" width="145" height="52" rx="26" fill="#13251c"></rect>
  <text x="1452" y="286" text-anchor="middle" class="label greenText">ACTIVATION</text>

  <rect x="1100" y="330" width="105" height="52" rx="26" fill="#13251c"></rect>
  <text x="1152" y="361" text-anchor="middle" class="label greenText">INSIGHT</text>

  <text x="1212" y="361" font-size="22" fill="#64748b">→</text>

  <rect x="1240" y="330" width="105" height="52" rx="26" fill="#422006"></rect>
  <text x="1292" y="361" text-anchor="middle" class="label orangeText">PAY</text>

  <text x="1352" y="361" font-size="22" fill="#64748b">→</text>

  <rect x="1380" y="330" width="145" height="52" rx="26" fill="#172554"></rect>
  <text x="1452" y="361" text-anchor="middle" class="label blueText">RETAIN</text>


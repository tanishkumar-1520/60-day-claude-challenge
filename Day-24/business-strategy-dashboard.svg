  <text x="120" y="581" text-anchor="middle" class="small">Founder-led</text>

  <rect x="185" y="535" width="100" height="62" rx="10" class="inner"></rect>
  <text x="235" y="560" text-anchor="middle" class="label purpleText">11–25</text>
  <text x="235" y="581" text-anchor="middle" class="small">Communities</text>

  <rect x="300" y="535" width="100" height="62" rx="10" class="inner"></rect>
  <text x="350" y="560" text-anchor="middle" class="label greenText">26–50</text>
  <text x="350" y="581" text-anchor="middle" class="small">Referrals</text>

  <rect x="415" y="535" width="90" height="62" rx="10" class="inner"></rect>
  <text x="460" y="560" text-anchor="middle" class="label orangeText">51–100</text>

  <text x="585" y="535" class="small">Features alone are not enough</text>

  <circle cx="805" cy="625" r="72" fill="#172554" stroke="#818cf8" stroke-width="2"></circle>
  <text x="805" y="618" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#f8fafc">
    NUTRISCOPE
  </text>
  <text x="805" y="640" text-anchor="middle" class="small">Nutrition</text>

  <line x1="730" y1="570" x2="660" y2="555" stroke="#38bdf8" stroke-width="2"></line>
  <text x="585" y="557" class="label blueText">Personal Data</text>

  <line x1="880" y1="570" x2="950" y2="555" stroke="#a78bfa" stroke-width="2"></line>
  <text x="890" y="557" class="label purpleText">AI Insights</text>

  <line x1="730" y1="680" x2="660" y2="700" stroke="#4ade80" stroke-width="2"></line>
  <text x="585" y="710" class="label greenText">Distribution</text>

  <line x1="880" y1="680" x2="950" y2="700" stroke="#fb923c" stroke-width="2"></line>
  <text x="890" y="710" class="label orangeText">Community</text>

  <text x="585" y="735" class="small">Potential moat strength: EARLY / UNPROVEN</text>

  <!-- RISKS -->
  <rect x="1075" y="475" width="480" height="270" rx="18" class="card" filter="url(#shadow)"></rect>
  <text x="1100" y="510" class="section">6. KEY BUSINESS RISKS</text>

  <rect x="1100" y="535" width="435" height="43" rx="9" fill="#2b1720"></rect>
  <text x="1120" y="562" class="label redText">⚠ Low user retention / food logging fatigue</text>

  <rect x="1100" y="588" width="435" height="43" rx="9" fill="#2b2117"></rect>
  <text x="1120" y="615" class="label orangeText">⚠ Users may not pay for another tracker</text>

  <rect x="1100" y="641" width="435" height="43" rx="9" fill="#2b1720"></rect>
  <text x="1120" y="668" class="label redText">⚠ Large competitors and low switching costs</text>

  <rect x="1100" y="694" width="435" height="43" rx="9" fill="#2b2117"></rect>
  <text x="1120" y="721" class="label orangeText">⚠ Acquisition cost and health-trust concerns</text>

  <!-- SCORECARD -->
  <rect x="45" y="770" width="730" height="270" rx="18" class="card" filter="url(#shadow)"></rect>
  <text x="70" y="805" class="section">7. INVESTMENT SCORECARD</text>

  <!-- Score rows -->
  <text x="70" y="842" class="label">Business Viability</text>
  <rect x="220" y="829" width="390" height="16" rx="8" fill="#1e293b"></rect>
  <rect x="220" y="829" width="281" height="16" rx="8" fill="url(#green)"></rect>
  <text x="630" y="843" class="label greenText">72</text>

  <text x="70" y="880" class="label">Revenue Potential</text>
  <rect x="220" y="867" width="390" height="16" rx="8" fill="#1e293b"></rect>
  <rect x="220" y="867" width="265" height="16" rx="8" fill="url(#accent)"></rect>
  <text x="630" y="881" class="label blueText">68</text>

  <text x="70" y="918" class="label">GTM Strength</text>
  <rect x="220" y="905" width="390" height="16" rx="8" fill="#1e293b"></rect>
  <rect x="220" y="905" width="238" height="16" rx="8" fill="#818cf8"></rect>
  <text x="630" y="919" class="label purpleText">61</text>

  <text x="70" y="956" class="label">Competitive Strength</text>
  <rect x="220" y="943" width="390" height="16" rx="8" fill="#1e293b"></rect>
  <rect x="220" y="943" width="211" height="16" rx="8" fill="#fb923c"></rect>
  <text x="630" y="957" class="label orangeText">54</text>

  <text x="70" y="994" class="label">Investor Readiness</text>
  <rect x="220" y="981" width="390" height="16" rx="8" fill="#1e293b"></rect>
  <rect x="220" y="981" width="187" height="16" rx="8" fill="#f87171"></rect>
  <text x="630" y="995" class="label redText">48</text>

  <rect x="665" y="835" width="80" height="130" rx="16" fill="#172554" stroke="#818cf8"></rect>
  <text x="705" y="880" text-anchor="middle" class="small">OVERALL</text>
  <text x="705" y="925" text-anchor="middle" font-family="Arial" font-size="35" font-weight="700" fill="#f8fafc">61</text>
  <text x="705" y="948" text-anchor="middle" class="small">/100</text>

  <!-- FINAL VERDICT -->
  <rect x="800" y="770" width="755" height="270" rx="18" class="card" filter="url(#shadow)"></rect>
  <text x="825" y="805" class="section">8. FINAL VERDICT</text>

  <rect x="825" y="835" width="200" height="75" rx="16" fill="#422006" stroke="#fb923c" stroke-width="2"></rect>
  <circle cx="855" cy="872" r="10" fill="#f59e0b"></circle>
  <text x="880" y="879" font-family="Arial" font-size="22" font-weight="700" fill="#fed7aa">
    VALIDATE
  </text>

  <text x="1050" y="855" class="label">SUSTAINABILITY THESIS</text>
  <text x="1050" y="880" class="small">
    NutriScope has potential because nutrition
  </text>
  <text x="1050" y="899" class="small">
    is a recurring problem with subscription
  </text>
  <text x="1050" y="918" class="small">
    potential. However, revenue and retention
  </text>
  <text x="1050" y="937" class="small">
    are not yet proven.
  </text>

  <rect x="825" y="935" width="690" height="78" rx="12" fill="#0d1628" stroke="#263552"></rect>
  <text x="845" y="962" class="label greenText">NEXT MILESTONE</text>
  <text x="845" y="987" font-family="Arial" font-size="16" font-weight="700" fill="#f8fafc">
    100 Users → 10+ Paying → Retention → Repeatable Acquisition
  </text>

  <!-- FOOTER -->
  <text x="800" y="1068" text-anchor="middle" class="small">
    NutriScope • Day 24 Business Strategy • Evidence over assumptions • Revenue over vanity metrics
  </text>
</svg>
  <text x="70" y="658" class="small">● 100 registered users</text>
  <text x="70" y="680" class="small">● 60+ activated users</text>
  <text x="280" y="658" class="small">● 10+ paying users</text>
  <text x="280" y="680" class="small">● 30%+ 30-day retention</text>
  <text x="70" y="713" class="small">● 10+ referrals</text>
  <text x="280" y="713" class="small">● Repeatable acquisition</text>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marketing Detective</title>
<style>
:root{--accent:#ff7a45;--accent2:#ffb38f;--bg:#0d0d10;--panel:#17171c;--paper:#e9dcc5;--ink:#17130f;--muted:#aaa6a0;--good:#5ee6a8;--danger:#ff6b6b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 10%,#252027 0,#101014 35%,#09090b 100%);color:#f7f4ef;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input{font:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);background:#0b0b0dcc;border-bottom:1px solid #ffffff12;padding:14px 5vw;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.04em}.badge{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#8f3219);display:grid;place-items:center;font-size:22px;box-shadow:0 0 25px #ff7a4533}.theme-select{background:#18181d;color:#fff;border:1px solid #ffffff18;border-radius:10px;padding:9px 12px}
.container{width:min(1180px,92%);margin:auto}.hero{padding:65px 0 35px;text-align:center}.eyebrow{color:var(--accent2);font-weight:800;text-transform:uppercase;letter-spacing:.15em;font-size:12px}.hero h1{font-size:clamp(42px,7vw,82px);line-height:.95;margin:14px 0;background:linear-gradient(120deg,#fff,var(--accent2));-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:680px;margin:18px auto;font-size:18px}.btn{border:0;border-radius:12px;padding:12px 18px;color:#fff;background:linear-gradient(135deg,var(--accent),#b8431e);font-weight:800;cursor:pointer;box-shadow:0 8px 25px #0005;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn.secondary{background:#222228;border:1px solid #ffffff14}.btn.good{background:linear-gradient(135deg,#15965d,#0e6841)}
.steps{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px 0 30px}.step{padding:7px 12px;border:1px solid #ffffff13;border-radius:999px;color:#777}.step.active{color:#fff;border-color:var(--accent);background:#ff7a4515}
.panel{background:linear-gradient(145deg,#19191fdd,#111116dd);border:1px solid #ffffff10;border-radius:20px;box-shadow:0 25px 70px #0008;padding:25px;margin:22px 0}.assignment{display:grid;grid-template-columns:1.4fr .6fr;gap:20px}.folder{background:linear-gradient(145deg,#b78b4e,#75532b);color:#1a130b;border-radius:16px;padding:28px;position:relative;overflow:hidden;box-shadow:0 20px 40px #0006}.folder:after{content:"CONFIDENTIAL";position:absolute;right:-32px;top:28px;transform:rotate(35deg);background:#d9b877;color:#4a3214;padding:7px 40px;font-size:11px;font-weight:900}.folder h2{margin:0 0 10px;font-size:34px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.meta div{background:#0002;padding:12px;border-radius:10px}.label{font-size:11px;text-transform:uppercase;opacity:.65;font-weight:800}.value{font-weight:800;margin-top:3px}
.board{background:radial-gradient(circle,#694d2b22 1px,transparent 1px),#3b2a1d;background-size:18px 18px;border-radius:18px;padding:25px;box-shadow:inset 0 0 60px #0008;min-height:420px}.board-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.evidence-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}.evidence{background:var(--paper);color:var(--ink);padding:18px;border-radius:4px;min-height:160px;position:relative;cursor:grab;box-shadow:6px 10px 18px #0007;transform:rotate(var(--r));transition:.2s}.evidence:hover{transform:rotate(0) translateY(-5px) scale(1.02);z-index:2}.evidence.dragging{opacity:.45}.pin{width:13px;height:13px;background:var(--accent);border-radius:50%;position:absolute;top:8px;left:50%;box-shadow:0 2px 5px #000}.evidence h3{font-size:15px;margin:12px 0 7px}.evidence p{font-size:13px;line-height:1.5;margin:0}.tag{display:inline-block;margin-top:12px;padding:4px 7px;border-radius:5px;background:#00000012;font-size:10px;font-weight:900;text-transform:uppercase}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{background:#0c0c10;border:1px solid #ffffff0d;border-radius:12px;padding:14px}.metric strong{display:block;font-size:22px;color:var(--accent2)}.metric small{color:#777}
.comments{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.comment{background:#f2df75;color:#24200d;padding:16px;border-radius:3px;box-shadow:5px 8px 15px #0005;transform:rotate(-1deg)}.comment:nth-child(2){transform:rotate(1.5deg)}.comment:nth-child(3){transform:rotate(-2deg)}
.solve-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mistakes{display:grid;gap:10px}.mistake{padding:15px;border:1px solid #ffffff12;border-radius:12px;background:#111116;cursor:pointer;transition:.2s}.mistake:hover{border-color:var(--accent)}.mistake.selected{border-color:var(--accent);background:#ff7a4513}.result{padding:20px;border-radius:14px;background:#0d1813;border:1px solid #5ee6a833;margin-top:18px}.wrong{background:#281313;border-color:#ff6b6b55}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lesson{padding:20px;background:#16161b;border:1px solid #ffffff10;border-radius:14px}.lesson h3{margin-top:0;color:var(--accent2)}.bar{height:10px;background:#25252b;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}.hidden{display:none}.fade{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.pulse{animation:pulse 1.2s ease}@keyframes pulse{50%{box-shadow:0 0 0 12px #ff7a4500,0 0 45px #ff7a4566}}.footer{text-align:center;color:#666;padding:40px 0;font-size:12px}
@media(max-width:800px){.assignment,.solve-grid,.report-grid{grid-template-columns:1fr}.evidence-grid{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(2,1fr)}.comments{grid-template-columns:1fr}.hero{padding-top:40px}}
@media(max-width:520px){.evidence-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.meta{grid-template-columns:1fr}.hero h1{font-size:48px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="badge">🕵️</div><span>MARKETING DETECTIVE</span></div><label>Theme <select id="theme" class="theme-select"><option value="orange">Claude Orange</option><option value="blue">Midnight Blue</option><option value="purple">Neon Purple</option><option value="green">Forensic Green</option></select></label></header>
<main class="container">
<section class="hero"><div class="eyebrow">60 Days of Claude · Case File</div><h1>Marketing Detective</h1><p>Every campaign leaves clues. Read the evidence, connect the dots, and expose the marketing mistake before the suspect gets away.</p><div class="steps" id="steps"></div></section>
<section id="appArea"></section>
</main>
<footer class="footer">Fictional cases • Offline-first • No tracking • No backend</footer>
</div>
<script>
const themes={orange:["#ff7a45","#ffb38f"],blue:["#4ea8ff","#a8d4ff"],purple:["#b56cff","#e1bfff"],green:["#43d99a","#a7f3d0"]};
const cases=[
{name:"Northstar Coffee",industry:"Specialty Coffee",objective:"Increase weekday morning orders",audience:"Urban professionals aged 22–35",channels:"Instagram • Search • Email",budget:"₹10L — 55% Instagram, 30% Search, 15% Email",metrics:["1.8M","0.42%","1.7%","312","₹3.1L"],comments:["I kept seeing beautiful latte photos but never saw a reason to order.","The discount email arrived at 11:45 PM.","Search ads looked useful when I was already searching for coffee."],social:"Reach was high, but saves and comments were low. Most interactions were passive likes.",mistake:"Optimizing for vanity reach instead of a clear conversion-focused offer",clues:["Huge Instagram reach but weak CTR","Email was sent outside the audience's active morning window","Search delivered fewer impressions but stronger conversion intent"],explanation:"The campaign bought attention rather than demand. The creative was attractive, but the audience had no compelling reason to act at the right moment.",improve:["Shift budget toward high-intent Search and morning-triggered email.","Use a clear weekday bundle with a single CTA.","Test short-form creative showing the offer, not just the product."]},
{name:"FitForge",industry:"Fitness App",objective:"Drive 30-day trial signups",audience:"Beginners who want simple home workouts",channels:"TikTok • Influencers • Landing page",budget:"₹15L — 65% influencers, 25% TikTok, 10% CRO",metrics:["4.2M","0.31%","2.1%","184","₹1.4L"],comments:["The influencer videos looked impressive, but the workouts felt advanced.","I couldn't tell which plan was for beginners.","The app looks premium, but I didn't understand the trial."],social:"Influencer posts generated strong views but unusually high negative comments around difficulty and intimidation.",mistake:"Mismatch between the promise/creative and the target audience's actual readiness",clues:["High views but very low trial conversion","Comments repeatedly mention workouts are too difficult","Landing page did not clearly label a beginner pathway"],explanation:"The campaign attracted attention from people who were not being served by the experience. Creative targeting and product onboarding told two different stories.",improve:["Feature real beginner transformations.","Create a clearly labeled beginner funnel.","Brief creators around accessibility rather than intensity."]},
{name:"LumaSkin",industry:"Skincare",objective:"Launch a new moisturizer",audience:"Women and men 25–40 with sensitive skin",channels:"Meta • YouTube • Retail",budget:"₹25L — 50% Meta, 35% YouTube, 15% retail",metrics:["6.8M","1.9%","4.8%","1,120","₹8.6L"],comments:["I wanted to know if it was fragrance-free.","The ad looked luxurious but didn't explain ingredients.","Reviews were buried below the fold."],social:"Engagement was strong, especially on ingredient questions. Brand replies were slow and generic.",mistake:"Failing to communicate the product's key trust attributes",clues:["Ingredient questions dominate comments","High engagement but lower-than-expected checkout rate","Product page hides reviews and sensitive-skin proof"],explanation:"The audience had intent, but uncertainty blocked purchase. The campaign communicated aspiration while customers were asking for reassurance.",improve:["Lead with fragrance-free and sensitive-skin proof.","Surface reviews and ingredient details near the CTA.","Build a comment-response playbook."]},
{name:"VoltRide",industry:"Electric Mobility",objective:"Generate qualified test rides",audience:"Daily commuters within 15 km of dealerships",channels:"Google • Outdoor • Instagram",budget:"₹30L — 45% Outdoor, 35% Google, 20% Instagram",metrics:["3.4M","2.4%","3.1%","860","₹21L"],comments:["I saw the billboard everywhere but didn't know where to test it.","The map on the website opened slowly.","The offer was good but expired before my weekend."],social:"Instagram generated moderate engagement. Local posts had the highest saves.",mistake:"Poor conversion infrastructure after awareness",clues:["Strong ad response but test-ride completion was low","Dealership locator was slow on mobile","Most leads came within a short distance of dealerships"],explanation:"Media worked, but the handoff failed. A location-based product needs an immediate, frictionless route from ad to appointment.",improve:["Create fast location-specific landing pages.","Add one-tap appointment booking.","Use geo-targeted creative with dealership distance."]},
{name:"StudyNest",industry:"EdTech",objective:"Sell an exam-prep subscription",audience:"College students preparing for competitive exams",channels:"YouTube • Search • Campus ambassadors",budget:"₹12L — 45% YouTube, 35% Search, 20% campus",metrics:["2.2M","2.8%","6.2%","2,340","₹12.8L"],comments:["The free lessons were genuinely useful.","I wasn't sure which plan matched my exam date.","Campus ambassadors explained the product better than the ads."],social:"YouTube watch time was excellent. Search queries containing exam names had the strongest conversion.",mistake:"Using one generic offer for audiences at different stages of exam readiness",clues:["Exam-specific searches convert far better","Students ask plan/timeline questions repeatedly","Ambassador conversations outperform generic ad traffic"],explanation:"The product had strong demand, but the offer was not contextual. Students need a plan based on exam, deadline, and preparation stage.",improve:["Build exam-specific landing pages.","Segment offers by preparation timeline.","Turn ambassador FAQs into ad creative."]},
{name:"GreenBasket",industry:"Grocery Delivery",objective:"Win first-time customers",audience:"Families in suburban neighborhoods",channels:"Push • Flyers • Meta",budget:"₹8L — 40% flyers, 35% Meta, 25% push",metrics:["900K","0.75%","2.9%","490","₹2.2L"],comments:["The flyer had a coupon but I couldn't remember the code.","Push notifications arrived while I was at work.","I trust local recommendations more than polished ads."],social:"Neighborhood groups produced fewer impressions but much higher referral activity.",mistake:"Ignoring the strongest local trust channel while overspending on broad awareness",clues:["Referral conversion is 3x paid social","Flyer coupon redemption is low despite distribution","Local group mentions generate the highest repeat rate"],explanation:"This is a trust-and-habit market. Broad paid awareness creates noise, while local proof and referrals reduce perceived delivery risk.",improve:["Launch neighborhood referral loops.","Partner with resident/community groups.","Simplify coupon redemption with QR links."]},
{name:"TrailPeak",industry:"Outdoor Apparel",objective:"Clear old-season inventory",audience:"Weekend hikers and value-conscious outdoor shoppers",channels:"Email • Meta • Affiliate",budget:"₹9L — 50% Meta, 30% affiliate, 20% email",metrics:["1.1M","1.3%","3.8%","760","₹6.9L"],comments:["I didn't realize the discount applied to last season.","The ad showed full-price products.","Affiliate sites explained the deal much better."],social:"Affiliate content had lower reach but the highest assisted revenue.",mistake:"Creative failed to make the inventory-clearance proposition obvious",clues:["Affiliate traffic converts strongly","Paid creative emphasizes lifestyle over discount","Customers ask what exactly is on sale"],explanation:"The campaign objective was liquidation, but the creative behaved like a brand campaign. The message and commercial goal were misaligned.",improve:["Use explicit clearance messaging.","Show before/after pricing clearly.","Repurpose affiliate deal framing into paid ads."]},
{name:"MellowTea",industry:"Beverages",objective:"Build a premium tea subscription",audience:"Tea enthusiasts aged 28–45",channels:"Podcast • Instagram • Email",budget:"₹14L — 40% podcast, 40% Instagram, 20% email",metrics:["1.6M","1.1%","7.4%","610","₹7.2L"],comments:["The story was memorable, but I didn't know what subscription to choose.","The tasting quiz was fun.","Email explained the blends better than the ads."],social:"Comments and saves were unusually strong around flavor notes and sourcing stories.",mistake:"Making the buying decision more complicated than the campaign promise",clues:["High engagement around product education","Email converts better than Instagram","Subscription choices are numerous and poorly differentiated"],explanation:"The audience is interested, but choice overload creates friction. The campaign earns curiosity and then loses customers at the decision point.",improve:["Create a 3-tier subscription structure.","Add a simple taste-profile recommender.","Move educational email content onto landing pages."]},
{name:"UrbanPet",industry:"Pet Care",objective:"Increase grooming bookings",audience:"Busy pet owners in dense urban areas",channels:"Maps • Instagram • SMS",budget:"₹7L — 45% Maps, 30% Instagram, 25% SMS",metrics:["700K","3.6%","5.9%","1,480","₹9.1L"],comments:["I wanted the nearest available slot immediately.","Instagram made the groomers look trustworthy.","SMS reminders helped me actually show up."],social:"Local Instagram posts generate strong saves. Maps traffic has the best conversion rate.",mistake:"Under-investing in the highest-intent local channel",clues:["Maps produces the highest booking rate","Instagram creates trust but fewer bookings","SMS improves show-up rate rather than acquisition"],explanation:"The campaign mixed acquisition and retention signals. Maps users already have intent, so it deserves more budget and stronger booking UX.",improve:["Increase Maps spend.","Optimize profiles with live availability/booking CTA.","Keep SMS as a retention and attendance layer."]},
{name:"NovaLearn",industry:"Online Courses",objective:"Sell a new data analytics course",audience:"Career switchers aged 24–34",channels:"LinkedIn • Webinar • Retargeting",budget:"₹20L — 45% LinkedIn, 35% webinar, 20% retargeting",metrics:["1.3M","1.7%","8.1%","940","₹14.7L"],comments:["The instructor's background convinced me.","I needed proof that the projects were job-relevant.","The webinar answered questions the landing page didn't."],social:"Professional comments focus on portfolio quality, salary outcomes, and instructor credibility.",mistake:"Leading with course features instead of career proof",clues:["Webinar conversion is strongest","Comments focus on outcomes rather than features","Landing page lists modules before showing project/career evidence"],explanation:"Career switchers purchase confidence, not a list of lessons. The campaign buried the evidence needed to reduce career-risk anxiety.",improve:["Move outcomes and portfolio projects above the fold.","Add instructor credibility and learner proof.","Use webinar objections as landing-page sections."]}
];
let current=null,stage=0,selected=null,solved=false,dragged=null;
const steps=["Case Assignment","Investigation Board","Investigate","Solve Case","Case Closed","Learning Report"];
const $=s=>document.querySelector(s);
function theme(v){let t=themes[v]||themes.orange;document.documentElement.style.setProperty("--accent",t[0]);document.documentElement.style.setProperty("--accent2",t[1]);localStorage.setItem("md-theme",v)}
$("#theme").value=localStorage.getItem("md-theme")||"orange";theme($("#theme").value);$("#theme").onchange=e=>theme(e.target.value);
function newCase(){current=cases[Math.floor(Math.random()*cases.length)];stage=0;selected=null;solved=false;render()}
function stepbar(){return `<div class="steps">${steps.map((s,i)=>`<span class="step ${i===stage?"active":i<stage?"done":""}">${i+1}. ${s}</span>`).join("")}</div>`}
function assignment(){return `<div class="panel fade"><div class="assignment"><div class="folder"><div class="label">Confidential Case File</div><h2>${current.name}</h2><p>${current.industry} • ${current.objective}</p><div class="meta"><div><div class="label">Target</div><div class="value">${current.audience}</div></div><div><div class="label">Channels</div><div class="value">${current.channels}</div></div><div><div class="label">Budget</div><div class="value">${current.budget}</div></div><div><div class="label">Mission</div><div class="value">Find the primary mistake.</div></div></div></div><div><h2>🔎 New Investigation</h2><p style="color:var(--muted)">A campaign has gone sideways. The evidence is scattered. Your job is to identify the single decision that caused the biggest performance problem.</p><button class="btn" onclick="startInvestigation()">Accept Case →</button></div></div></div>`}
function board(){let ev=[["Campaign Metrics",`Reach ${current.metrics[0]} • CTR ${current.metrics[1]} • Engagement ${current.metrics[2]} • Conversions ${current.metrics[3]} • Sales ${current.metrics[4]}`,"DATA"],["Customer Voices",current.comments.join(" • "),"CUSTOMER"],["Social Signal",current.social,"SOCIAL"],["Clue #1",current.clues[0],"CLUE"],["Clue #2",current.clues[1],"CLUE"],["Clue #3",current.clues[2],"CLUE"]];return `<div class="panel fade"><div class="board"><div class="board-head"><div><div class="label">Evidence Wall</div><h2 style="margin:5px 0">Connect the clues</h2></div><span>${ev.length} evidence cards</span></div><div class="evidence-grid">${ev.map((e,i)=>`<article draggable="true" class="evidence" style="--r:${[-2,1.5,-1,1,-1.5,2][i]}deg" data-id="${i}" ondragstart="dragStart(event)" ondragend="dragEnd(event)"><div class="pin"></div><h3>${e[0]}</h3><p>${e[1]}</p><span class="tag">${e[2]}</span></article>`).join("")}</div><div style="margin-top:22px;text-align:center;color:#d2c0aa">↔ Drag cards around the board to organize your theory. Then inspect the case solution.</div></div><div style="display:flex;gap:10px;justify-content:center;margin-top:18px"><button class="btn" onclick="goInvestigate()">Evidence Organized →</button></div></div>`}
function investigate(){return `<div class="panel fade"><h2>🧠 What is the evidence really saying?</h2><p style="color:var(--muted)">Before solving, inspect the performance pattern. Strong numbers can still hide a broken funnel.</p><div class="metrics">${["Reach","CTR","Engagement","Conversions","Sales"].map((x,i)=>`<div class="metric"><small>${x}</small><strong>${current.metrics[i]}</strong></div>`).join("")}</div><h3>Customer Comments</h3><div class="comments">${current.comments.map(x=>`<div class="comment">“${x}”</div>`).join("")}</div><div class="panel" style="margin-bottom:0"><h3>Social Media Performance</h3><p>${current.social}</p><div class="bar"><span style="width:${Math.min(92,35+current.metrics[2].length*6)}%"></span></div></div><div style="text-align:center;margin-top:18px"><button class="btn" onclick="goSolve()">I Have a Theory →</button></div></div>`}
function solve(){let opts=[current.mistake,"The campaign budget was too small to generate enough awareness","The brand used too many marketing channels","The campaign should have posted more often on social media"];return `<div class="panel fade"><h2>🕵️ Name the primary marketing mistake</h2><p style="color:var(--muted)">Choose the one decision that best explains the majority of evidence. Don't chase every symptom.</p><div class="solve-grid"><div class="mistakes">${opts.map((x,i)=>`<div class="mistake ${selected===i?"selected":""}" onclick="selectMistake(${i})"><b>${String.fromCharCode(65+i)}.</b> ${x}</div>`).join("")}</div><div><div class="folder" style="min-height:250px"><div class="label">Detective's Note</div><h2 style="font-size:25px">One mistake. Three clues.</h2><p>Look for the explanation that connects the metrics, customer comments, and channel behavior without needing extra assumptions.</p></div><button class="btn" style="margin-top:15px;width:100%" onclick="submitAnswer()">Submit Verdict</button></div></div>${solved?`<div class="result"><h2>Case Closed! ✓</h2><p><b>Correct answer:</b> ${current.mistake}</p><p>${current.explanation}</p><button class="btn good" onclick="showReport()">Open Learning Report →</button></div>`:""}</div>`}
function report(){return `<div class="panel fade"><div style="text-align:center"><div class="eyebrow">Investigation Complete</div><h1 style="font-size:50px;margin:10px 0">CASE CLOSED</h1><p style="color:var(--muted)">${current.name} has been solved. Here's what the evidence teaches.</p></div><div class="report-grid"><div class="lesson"><h3>🎯 Primary Lesson</h3><p>${current.explanation}</p></div><div class="lesson"><h3>🧩 Supporting Clues</h3><ul>${current.clues.map(c=>`<li>${c}</li>`).join("")}</ul></div><div class="lesson"><h3>🚀 Suggested Improvements</h3><ul>${current.improve.map(c=>`<li>${c}</li>`).join("")}</ul></div><div class="lesson"><h3>📚 Detective Framework</h3><p><b>1.</b> Start with the objective.<br><b>2.</b> Compare intent vs. behavior.<br><b>3.</b> Read customer language literally.<br><b>4.</b> Find the bottleneck, not the loudest metric.<br><b>5.</b> Fix the message, audience, channel, or conversion path.</p></div></div><div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap"><button class="btn" onclick="newCase()">Replay Random Case ↻</button><button class="btn secondary" onclick="downloadReport()">Save Learning Notes</button></div></div>`}
function render(){if(!current)newCase();$("#steps").outerHTML=stepbar();$("#appArea").innerHTML=stage===0?assignment():stage===1?board():stage===2?investigate():stage===3?solve():report();if(stage===5)stage=4}
function startInvestigation(){stage=1;render();window.scrollTo({top:0,behavior:"smooth"})}
function goInvestigate(){stage=2;render()}
function goSolve(){stage=3;render()}
function selectMistake(i){selected=i;render()}
function submitAnswer(){if(selected===null){alert("Choose a theory first.");return}if(selected===0){solved=true;stage=4;render();setTimeout(()=>document.querySelector(".result")?.classList.add("pulse"),50)}else{solved=false;render();alert("Not quite. Re-read the customer comments and channel clues.");}}
function showReport(){stage=5;render()}
function dragStart(e){dragged=e.currentTarget;dragged.classList.add("dragging")}
function dragEnd(){dragged?.classList.remove("dragging");dragged=null}
function downloadReport(){let text=`MARKETING DETECTIVE — ${current.name}\n\nPrimary mistake: ${current.mistake}\n\nExplanation: ${current.explanation}\n\nClues:\n- ${current.clues.join("\n- ")}\n\nImprovements:\n- ${current.improve.join("\n- ")}`;let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download="marketing-detective-learning-notes.txt";a.click();URL.revokeObjectURL(a.href)}
document.addEventListener("dragover",e=>{if(dragged)e.preventDefault()});document.addEventListener("drop",e=>{if(dragged&&e.target.closest(".evidence-grid")){e.preventDefault();let target=e.target.closest(".evidence");if(target&&target!==dragged){let grid=target.parentNode;let rect=target.getBoundingClientRect();grid.insertBefore(dragged,e.clientX<rect.left+rect.width/2?target:target.nextSibling)}}});
newCase();
</script>
</body>
</html>
